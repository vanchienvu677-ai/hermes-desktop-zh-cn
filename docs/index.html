<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hermes Desktop 中文补丁</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.65;
      }
      body {
        margin: 0;
        background: Canvas;
        color: CanvasText;
      }
      main {
        width: min(880px, calc(100% - 32px));
        margin: 0 auto;
        padding: 64px 0;
      }
      h1 {
        font-size: 40px;
        margin: 0 0 12px;
      }
      p {
        font-size: 17px;
      }
      a {
        color: #0969da;
      }
      code {
        padding: 2px 6px;
        border-radius: 6px;
        background: color-mix(in srgb, CanvasText 8%, transparent);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 28px 0;
      }
      .actions a {
        display: inline-block;
        padding: 10px 14px;
        border: 1px solid color-mix(in srgb, CanvasText 22%, transparent);
        border-radius: 8px;
        text-decoration: none;
      }
      section {
        margin-top: 40px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hermes Desktop 中文补丁</h1>
      <p>面向官方 Hermes Desktop 的非官方简体中文本地化补丁。项目只分发 patch、脚本和文档，不分发官方安装包或 app.asar。</p>
      <div class="actions">
        <a href="https://github.com/vanchienvu677-ai/hermes-desktop-zh-cn">GitHub 仓库</a>
        <a href="https://github.com/vanchienvu677-ai/hermes-desktop-zh-cn/releases/latest">下载最新版</a>
        <a href="https://hermes-agent.nousresearch.com/desktop">官方 Hermes Desktop</a>
      </div>
      <section>
        <h2>快速使用</h2>
        <p>macOS 可双击 <code>install-mac.command</code>，或在终端运行：</p>
        <pre><code>./install-mac.command</code></pre>
      </section>
      <section>
        <h2>维护边界</h2>
        <p>本项目保留 Hermes、Nous Research、模型 ID、环境变量和命令名等技术标识，只翻译主要用户可见界面。</p>
      </section>
    </main>
  </body>
</html>
